<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>File Upload</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ccff00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #39ff14;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 10px #39ff14;
        }

        .container {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.5);
            max-width: 450px;
            width: 100%;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            position: relative;
            margin-bottom: 30px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 16px 12px 12px;
            background-color: #000;
            border: 2px solid #39ff14;
            border-radius: 6px;
            color: #ccff00;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #ffea00;
            box-shadow: 0 0 10px #ffea00;
        }

        label {
            position: absolute;
            left: 12px;
            top: 14px;
            color: #999;
            font-size: 0.9rem;
            pointer-events: none;
            transition: all 0.2s ease;
            background-color: #1a1a1a;
            padding: 0 5px;
        }

        input:focus + label,
        input:not(:placeholder-shown) + label {
            top: -10px;
            left: 10px;
            font-size: 0.75rem;
            color: #ffea00;
        }

        .file-name {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 6px;
        }

        button {
            background-color: #ccff00;
            color: #000;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #39ff14;
            box-shadow: 0 0 15px #39ff14;
        }

        button:disabled {
            background-color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid #000;
            border-top: 3px solid #ccff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            margin-top: 20px;
            font-size: 1rem;
            color: #ffea00;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload File</h1>

        <form id="uploadForm" method="post" enctype="multipart/form-data" action="/web/upload">
            <div class="form-group">
                <input type="text" id="uuid" name="uuid" required placeholder=" ">
                <label for="uuid">Upload Token UUID</label>
            </div>

            <div class="form-group">
                <input type="file" id="file" name="file" required>
                <label for="file">Choose file to upload</label>
                <div id="fileName" class="file-name">No file selected</div>
            </div>

            <button type="submit" id="submitBtn">Upload</button>
        </form>

        <div th:if="${message}" class="message">
            <p th:text="${message}"></p>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file');
        const fileName = document.getElementById('fileName');
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');

        fileInput.addEventListener('change', () => {
            const name = fileInput.files[0]?.name || 'No file selected';
            fileName.textContent = name;
        });

        form.addEventListener('submit', () => {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Uploading...';
        });
    </script>
</body>
</html>
